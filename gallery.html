<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Gallery | Suraj Logistics</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#071c35;
color:#f7f7f5;
}
header{
text-align:center;
padding:25px;
border-bottom:2px solid #d5a44e;
background:#04162b;
}
header img{
width:300px;
max-width:85%;
}
.home{
display:inline-block;
padding:12px 24px;
border:1px solid #d5a44e;
border-radius:5px;
color:#d5a44e;
text-decoration:none;
}
main{
max-width:1250px;
margin:auto;
padding:30px 20px;
}
h1,h2{
color:#d5a44e;
text-align:center;
}
h1{font-size:36px}
h2{font-size:28px}
p{text-align:center}
.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:22px;
margin:30px 0 50px;
}
figure{
margin:0;
border:2px solid #d5a44e;
border-radius:8px;
overflow:hidden;
background:#102740;
}
figure img{
width:100%;
aspect-ratio:4/3;
object-fit:contain;
display:block;
}
figcaption{
color:#d5a44e;
text-align:center;
padding:16px 10px;
font-weight:bold;
line-height:1.5;
}
hr{
border:0;
border-top:1px solid #d5a44e;
margin:40px 0;
}
footer{
text-align:center;
padding:30px;
color:#d5a44e;
background:#04162b;
}
@media(max-width:850px){
.gallery{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:550px){
.gallery{grid-template-columns:1fr}
h1{font-size:28px}
h2{font-size:23px}
}
.gallery:first-of-type figure:nth-child(-n+5) figcaption {
    display: none;
}
</style>
</head>
